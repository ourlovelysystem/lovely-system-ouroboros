<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ouroboros</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: #0b0906;
    overflow: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
  }

  .stage {
    position: relative;
    width: 92vmin;
    height: 92vmin;
  }

  /* The ring itself spins continuously. */
  .ring {
    position: absolute;
    inset: 0;
    animation: spin 22s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* Each tile is placed at a fixed angle + radius from center. */
  .tile {
    position: absolute;
    top: 50%; left: 50%;
    width: 11vmin;
    margin: -8.2vmin 0 0 -5.5vmin; /* half tile size, tile aspect ~420:625 */
  }

  .tile-face {
    position: relative;
    width: 100%;
  }

  .tile-img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: auto;
    border-radius: 8%;
    box-shadow: 0 6px 18px rgba(0,0,0,0.65);
    display: block;
    transition: opacity 0.2s ease;
  }
  .tile-strike { opacity: 0; }
  .tile:hover .tile-letter { opacity: 0; }
  .tile:hover .tile-strike { opacity: 1; }

  /* Center hotspot: fixed position/size, doesn't move or spin -
     only its contents animate, so hover detection stays put. */
  .center {
    position: absolute;
    top: 50%; left: 50%;
    width: 16vmin; height: 16vmin;
    margin: -8vmin 0 0 -8vmin;
  }

  .mouse-icon {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    opacity: 1;
  }
  .center:hover .mouse-icon {
    animation: scurry 0.6s ease-in forwards;
  }
  @keyframes scurry {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    55%  { transform: translate(120%, -55%) rotate(-18deg); opacity: 1; }
    100% { transform: translate(230%, -95%) rotate(-25deg); opacity: 0; }
  }

  .center-strike {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.35s ease 0.55s;
    box-shadow: 0 0 24px rgba(0,0,0,0.7);
  }
  .center:hover .center-strike {
    opacity: 1;
  }

  @media (prefers-reduced-motion: reduce) {
    .ring { animation: none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="ring">
    <!-- No counter-rotation anywhere: a tile's visual tilt is just its
         live position angle (ring spin + fixed slot angle), like text
         printed radially on a real spinning disc. Upright at the 0deg
         (top) position, inverted at 180deg (bottom), by construction. -->
    <div class="tile" style="transform: rotate(0deg) translateY(-33vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/o.jpg" alt="O" />
        <img class="tile-img tile-strike" src="images/strike.jpg" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(40deg) translateY(-33vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/u.jpg" alt="U" />
        <img class="tile-img tile-strike" src="images/strike.jpg" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(80deg) translateY(-33vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/r.jpg" alt="R" />
        <img class="tile-img tile-strike" src="images/strike.jpg" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(120deg) translateY(-33vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/o.jpg" alt="O" />
        <img class="tile-img tile-strike" src="images/strike.jpg" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(160deg) translateY(-33vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/b.jpg" alt="B" />
        <img class="tile-img tile-strike" src="images/strike.jpg" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(200deg) translateY(-33vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/o.jpg" alt="O" />
        <img class="tile-img tile-strike" src="images/strike.jpg" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(240deg) translateY(-33vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/r.jpg" alt="R" />
        <img class="tile-img tile-strike" src="images/strike.jpg" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(280deg) translateY(-33vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/o.jpg" alt="O" />
        <img class="tile-img tile-strike" src="images/strike.jpg" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(320deg) translateY(-33vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/s.jpg" alt="S" />
        <img class="tile-img tile-strike" src="images/strike.jpg" alt="" />
      </div>
    </div>
  </div>

  <div class="center">
    <svg class="mouse-icon" viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg">
      <path d="M8 40 Q -4 30 8 22 Q 14 26 16 32" fill="none" stroke="#eee" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="45" cy="36" rx="32" ry="20" fill="#f5f5f0" stroke="#d8d8d0" stroke-width="1"/>
      <circle cx="24" cy="16" r="9" fill="#f5f5f0" stroke="#d8d8d0" stroke-width="1"/>
      <circle cx="24" cy="16" r="4.5" fill="#f2c9d1"/>
      <circle cx="46" cy="12" r="9" fill="#f5f5f0" stroke="#d8d8d0" stroke-width="1"/>
      <circle cx="46" cy="12" r="4.5" fill="#f2c9d1"/>
      <circle cx="34" cy="32" r="2" fill="#2a2a2a"/>
      <circle cx="76" cy="38" r="4" fill="#f2c9d1"/>
      <path d="M8 40 Q30 50 55 46" fill="none" stroke="#d8d8d0" stroke-width="1" opacity="0.6"/>
    </svg>
    <img class="center-strike" src="images/strike.jpg" alt="" />
  </div>
</div>

</body>
</html>
