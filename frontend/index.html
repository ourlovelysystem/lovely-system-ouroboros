<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ouroboros</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: #0b0906;
    overflow: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
  }

  .stage {
    position: relative;
    width: 98vmin;
    height: 98vmin;

    /* Light field geometry - adjust these to move/resize/strengthen the
       light source. x/y are position within the stage box (0% 0% = top-
       left corner, 50% 50% = dead center). spread is how far the light
       reaches before fading to nothing, as a % of the distance from the
       source to the stage's farthest corner - past that point it's
       already fully transparent, so there's no edge to reveal no matter
       how far spread is below 100%. intensity is peak brightness at the
       source, 0-1. */
    --light-x: 12%;
    --light-y: 10%;
    --light-spread: 58%;
    --light-intensity: 0.5;
  }

  /* The ring itself spins continuously. */
  .ring {
    position: absolute;
    inset: 0;
    animation: spin 22s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(-360deg); }
  }

  /* Each tile is placed at a fixed angle + radius from center. */
  .tile {
    position: absolute;
    top: 50%; left: 50%;
    width: 13.5vmin;
    margin: -6.75vmin 0 0 -6.75vmin; /* half tile size - tile-face is a fixed square */
  }

  /* Fixed square box, independent of any one image's native aspect
     ratio - the letter crops (from most.jpg) and strike.png aren't the
     same shape, and object-fit:cover on both means swapping between
     them on hover never resizes the tile. */
  .tile-face {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
  }

  .tile-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8%;
    box-shadow: 0 6px 18px rgba(0,0,0,0.65);
    display: block;
    transition: opacity 0.2s ease;
  }
  .tile-strike {
    opacity: 0;
    /* Letter tiles use cover (from .tile-img) to fill the square cleanly,
       but the strike photo is a portrait head shot - cover crops its top
       and bottom to fill a square, cutting into the jaw. contain shows
       the whole head, letterboxed on transparent, never cropped. */
    object-fit: contain;
  }
  .tile:hover .tile-letter { opacity: 0; }
  .tile:hover .tile-strike { opacity: 1; }

  /* Center hotspot: fixed position/size, doesn't move or spin -
     only its contents animate, so hover detection stays put. */
  .center {
    position: absolute;
    top: 50%; left: 50%;
    width: 19vmin; height: 19vmin;
    margin: -9.5vmin 0 0 -9.5vmin;
  }

  /* object-fit:contain because each sprite frame is cropped tight to its
     own pose (idle/standing frames are tall, posture frames differ too) -
     mouse.js swaps which frame this <img> points at. */
  .mouse-icon {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    opacity: 1;
  }

  /* Scurry/escape-on-hover behavior removed 2026-09-20 pending new specs -
     the first-pass version (turn_r_1-4->turn_right at 65ms, then
     scurry_r_a/contact/b at 70ms x3, this .center-strike reveal on a 1.2s/
     1.1s timings) worked well and is preserved in git history (see commit
     ebcd6be) plus a memory note - not deleted, just not wired up right now.
     strike.png stays in images/ for when this comes back. */

  /* Light source: a fixed radial glow in screen space (does NOT spin
     with .ring), so tiles visibly brighten as their orbit carries them
     through it and dim again as they move away - "passing through the
     light stream." mix-blend-mode: screen only ever adds brightness
     (never darkens). Sized to farthest-corner with several eased stops,
     fully transparent well before 100% (see --light-spread above), so
     the falloff is always gradual and there is no point anywhere in the
     frame where the light visibly "ends" - no edge, no ring. Geometry
     is the --light-* custom properties on .stage above - tune those,
     not this block, to move/resize/strengthen the light. */
  .light-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: radial-gradient(
      circle farthest-corner at var(--light-x) var(--light-y),
      rgba(255, 255, 255, var(--light-intensity)) 0%,
      rgba(255, 255, 255, calc(var(--light-intensity) * 0.45)) calc(var(--light-spread) * 0.35),
      rgba(255, 255, 255, calc(var(--light-intensity) * 0.12)) calc(var(--light-spread) * 0.7),
      rgba(255, 255, 255, 0) var(--light-spread)
    );
    mix-blend-mode: screen;
  }

  /* The actual fixture: a lamp on a post, so the glow above reads as
     light coming FROM something, not just an unexplained bright patch.
     Positioned via the same --light-x/--light-y as the glow (translate
     shifts by the bulb's own fractional position within this element's
     box, so the bulb - not the element's corner - lands exactly on that
     point) - move the light source by editing those two variables only,
     the post/bracket/bulb all move together. */
  .street-lamp {
    position: absolute;
    left: var(--light-x);
    top: var(--light-y);
    width: 26vmin;
    transform: translate(-68%, -72%);
    z-index: 11;
    pointer-events: none;
  }
  .street-lamp svg { width: 100%; height: 100%; display: block; overflow: visible; }

  @media (prefers-reduced-motion: reduce) {
    .ring { animation: none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="ring">
    <!-- No counter-rotation anywhere: a tile's visual tilt is just its
         live position angle (ring spin + fixed slot angle), like text
         printed radially on a real spinning disc. Upright at the 0deg
         (top) position, inverted at 180deg (bottom), by construction. -->
    <div class="tile" style="transform: rotate(0deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/o.png" alt="O" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(40deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/u.png" alt="U" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(80deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/r.png" alt="R" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(120deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/o.png" alt="O" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(160deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/b.png" alt="B" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(200deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/o.png" alt="O" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(240deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/r.png" alt="R" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(280deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/o.png" alt="O" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(320deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/s.png" alt="S" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
  </div>

  <div class="center">
    <img class="mouse-icon" id="mouse-icon" src="images/mouse/idle.png" alt="" />
  </div>

  <div class="light-overlay"></div>

  <div class="street-lamp">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="bulbGlow" x="-100%" y="-100%" width="300%" height="300%">
          <feGaussianBlur stdDeviation="3.2" />
        </filter>
      </defs>
      <!-- post, entering from the corner off-frame -->
      <line x1="-10" y1="-10" x2="35" y2="38" stroke="#15100c" stroke-width="4.5" stroke-linecap="round" />
      <!-- curved bracket arm out to the hanging lamp -->
      <path d="M35 38 Q54 28 68 50" fill="none" stroke="#15100c" stroke-width="4" stroke-linecap="round" />
      <line x1="68" y1="50" x2="68" y2="59" stroke="#15100c" stroke-width="3" />
      <circle cx="68" cy="57" r="3" fill="#15100c" />
      <!-- lantern cage -->
      <polygon points="55,60 81,60 88,72 81,84 55,84 48,72" fill="#0f0b08" stroke="#4a3620" stroke-width="1.5" />
      <line x1="61.3" y1="60" x2="61.3" y2="84" stroke="#4a3620" stroke-width="1" />
      <line x1="74.7" y1="60" x2="74.7" y2="84" stroke="#4a3620" stroke-width="1" />
      <!-- the bulb: this point is what --light-x/--light-y aligns to -->
      <circle cx="68" cy="72" r="10" fill="#fff3cf" filter="url(#bulbGlow)" />
      <circle cx="68" cy="72" r="5.5" fill="#fffdf4" />
    </svg>
  </div>
</div>

<script src="mouse.js"></script>
</body>
</html>
