<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ouroboros</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: #0b0906;
    overflow: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
  }

  :root {
    /* Light field geometry. x/y are position within the VIEWPORT (0% 0% =
       absolute upper-left corner). spread is how far the light reaches
       before fading to nothing, as a % of the distance from the source to
       the viewport's farthest corner - at 100%, with x/y at 0% 0%, that
       farthest corner is exactly the absolute lower-right of the
       viewport, so the light spans corner to corner. intensity is peak
       brightness at the source, 0-1. */
    --light-x: 0%;
    --light-y: 0%;
    --light-spread: 100%;
    --light-intensity: 0.5;
  }

  .stage {
    position: relative;
    width: 98vmin;
    height: 98vmin;
  }

  /* The ring itself spins continuously. */
  .ring {
    position: absolute;
    inset: 0;
    animation: spin 22s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(-360deg); }
  }

  /* Each tile is placed at a fixed angle + radius from center. */
  .tile {
    position: absolute;
    top: 50%; left: 50%;
    width: 13.5vmin;
    margin: -6.75vmin 0 0 -6.75vmin; /* half tile size - tile-face is a fixed square */
  }

  /* Fixed square box, independent of any one image's native aspect
     ratio - the letter crops (from most.jpg) and strike.png aren't the
     same shape, and object-fit:cover on both means swapping between
     them on hover never resizes the tile. */
  .tile-face {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
  }

  .tile-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8%;
    box-shadow: 0 6px 18px rgba(0,0,0,0.65);
    display: block;
    transition: opacity 0.2s ease;
  }
  .tile-strike {
    opacity: 0;
    /* Letter tiles use cover (from .tile-img) to fill the square cleanly,
       but the strike photo is a portrait head shot - cover crops its top
       and bottom to fill a square, cutting into the jaw. contain shows
       the whole head, letterboxed on transparent, never cropped. */
    object-fit: contain;
  }
  /* Not CSS :hover: the ring moves tiles via transform animation, and
     :hover only recomputes on real pointer events - a tile rotating out
     from under a stationary pointer never fires one, so it would stay
     stuck. ring-hover.js tracks pointer position and checks each tile's
     live getBoundingClientRect() every animation frame instead, toggling
     this class - correct regardless of whether the tile or the pointer
     is what moved. */
  .tile.is-struck .tile-letter { opacity: 0; }
  .tile.is-struck .tile-strike { opacity: 1; }

  /* Scurry/escape-on-hover behavior removed 2026-09-20 pending new specs -
     the first-pass version (turn_r_1-4->turn_right at 65ms, then
     scurry_r_a/contact/b at 70ms x3, this .center-strike reveal on a 1.2s/
     1.1s timings) worked well and is preserved in git history (see commit
     ebcd6be) plus a memory note - not deleted, just not wired up right now.
     strike.png stays in images/ for when this comes back. */

  /* Light source: a radial glow FIXED TO THE VIEWPORT (not .stage, and
     not spinning with .ring) - position:fixed means its 0%/100% points
     are the actual viewport corners regardless of the stage's own size
     or centering. No mix-blend-mode: normal alpha compositing, so this
     paints as a visible translucent white layer sitting in front of the
     ring, not an invisible brightness trick blended into it. Several
     eased stops for a gradual falloff all the way to the far corner
     (--light-spread: 100% above) - no edge, no ring, anywhere in the
     frame. */
  .light-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: radial-gradient(
      circle farthest-corner at var(--light-x) var(--light-y),
      rgba(255, 255, 255, var(--light-intensity)) 0%,
      rgba(255, 255, 255, calc(var(--light-intensity) * 0.45)) calc(var(--light-spread) * 0.35),
      rgba(255, 255, 255, calc(var(--light-intensity) * 0.12)) calc(var(--light-spread) * 0.7),
      rgba(255, 255, 255, 0) var(--light-spread)
    );
  }

  @media (prefers-reduced-motion: reduce) {
    .ring { animation: none; }
  }

  /* Diagnostic only - shows when this page was last deployed, read from
     the page's own HTTP Last-Modified header (a no-store fetch, so it
     always reflects the currently-deployed file, not a cached one). */
  .diag {
    position: fixed;
    left: 8px; bottom: 8px;
    z-index: 20;
    font-family: monospace;
    font-size: 11px;
    color: rgba(255, 255, 255, 0.35);
    pointer-events: none;
  }

  /* Custom animated pointer (hand pinching the mouse's tail, wiggling it).
     Source frames are 258x384 (2x the 129x192 display size, for retina
     sharpness); positioned/animated by pointer.js. Hotspot is a single
     fixed offset (not recalculated per frame) at the mouse's average
     position across all 12 frames, instead of the hand's. See HOTSPOT_X/
     HOTSPOT_Y in pointer.js. */
  body { cursor: none; }
  .custom-pointer {
    position: fixed;
    top: 0; left: 0;
    z-index: 30;
    pointer-events: none;
    width: 129px;
    height: 192px;
    opacity: 0;
  }

  /* Mystery-hole photo, dead center of the ring - sibling of .ring (not
     inside it), so it stays fixed while the ring spins around it. Sized
     to preserve the source photo's own aspect ratio (784x1168). */
  .center {
    position: absolute;
    top: 50%; left: 50%;
    width: 26.86vmin; height: 40vmin;
    transform: translate(-50%, -50%);
  }
  .center-img {
    display: block;
    width: 100%; height: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="ring">
    <!-- No counter-rotation anywhere: a tile's visual tilt is just its
         live position angle (ring spin + fixed slot angle), like text
         printed radially on a real spinning disc. Upright at the 0deg
         (top) position, inverted at 180deg (bottom), by construction. -->
    <div class="tile" style="transform: rotate(0deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/o.png" alt="O" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(40deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/u.png" alt="U" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(80deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/r.png" alt="R" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(120deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/o.png" alt="O" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(160deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/b.png" alt="B" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(200deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/o.png" alt="O" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(240deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/r.png" alt="R" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(280deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/o.png" alt="O" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(320deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/s.png" alt="S" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
  </div>

  <div class="center">
    <img class="center-img" src="images/mystery-hole.png" alt="" />
  </div>
</div>

<div class="light-overlay"></div>

<div class="diag" id="diag">last pushed: loading...</div>

<script src="ring-hover.js"></script>
<script src="diag.js"></script>
<script src="pointer.js"></script>
</body>
</html>
