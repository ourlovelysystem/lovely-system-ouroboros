<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ouroboros</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; width: 100%; height: 100%;
    background: #0b0906;
    overflow: hidden;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: Georgia, 'Times New Roman', serif;
  }

  :root {
    /* Light field geometry. x/y are position within the VIEWPORT (0% 0% =
       absolute upper-left corner). spread is how far the light reaches
       before fading to nothing, as a % of the distance from the source to
       the viewport's farthest corner - at 100%, with x/y at 0% 0%, that
       farthest corner is exactly the absolute lower-right of the
       viewport, so the light spans corner to corner. intensity is peak
       brightness at the source, 0-1. */
    --light-x: 0%;
    --light-y: 0%;
    --light-spread: 100%;
    --light-intensity: 0.5;
  }

  .stage {
    position: relative;
    width: 98vmin;
    height: 98vmin;
  }

  /* The ring itself spins continuously. */
  .ring {
    position: absolute;
    inset: 0;
    animation: spin 22s linear infinite;
  }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(-360deg); }
  }

  /* Each tile is placed at a fixed angle + radius from center. */
  .tile {
    position: absolute;
    top: 50%; left: 50%;
    width: 13.5vmin;
    margin: -6.75vmin 0 0 -6.75vmin; /* half tile size - tile-face is a fixed square */
  }

  /* Fixed square box, independent of any one image's native aspect
     ratio - the letter crops (from most.jpg) and strike.png aren't the
     same shape, and object-fit:cover on both means swapping between
     them on hover never resizes the tile. */
  .tile-face {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
  }

  .tile-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 8%;
    box-shadow: 0 6px 18px rgba(0,0,0,0.65);
    display: block;
    transition: opacity 0.2s ease;
  }
  .tile-strike {
    opacity: 0;
    /* Letter tiles use cover (from .tile-img) to fill the square cleanly,
       but the strike photo is a portrait head shot - cover crops its top
       and bottom to fill a square, cutting into the jaw. contain shows
       the whole head, letterboxed on transparent, never cropped. */
    object-fit: contain;
  }
  .tile:hover .tile-letter { opacity: 0; }
  .tile:hover .tile-strike { opacity: 1; }

  /* Center hotspot: fixed position/size, doesn't move or spin -
     only its contents animate, so hover detection stays put. */
  .center {
    position: absolute;
    top: 50%; left: 50%;
    width: 19vmin; height: 19vmin;
    margin: -9.5vmin 0 0 -9.5vmin;
  }

  /* object-fit:contain because each sprite frame is cropped tight to its
     own pose (idle/standing frames are tall, posture frames differ too) -
     mouse.js swaps which frame this <img> points at. */
  .mouse-icon {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    opacity: 1;
  }

  /* Scurry/escape-on-hover behavior removed 2026-09-20 pending new specs -
     the first-pass version (turn_r_1-4->turn_right at 65ms, then
     scurry_r_a/contact/b at 70ms x3, this .center-strike reveal on a 1.2s/
     1.1s timings) worked well and is preserved in git history (see commit
     ebcd6be) plus a memory note - not deleted, just not wired up right now.
     strike.png stays in images/ for when this comes back. */

  /* Light source: a radial glow FIXED TO THE VIEWPORT (not .stage, and
     not spinning with .ring) - position:fixed means its 0%/100% points
     are the actual viewport corners regardless of the stage's own size
     or centering. Tiles visibly brighten as their orbit carries them
     through it and dim again as they move away. mix-blend-mode: screen
     only ever adds brightness (never darkens). Several eased stops for a
     gradual falloff all the way to the far corner (--light-spread: 100%
     above) - no edge, no ring, anywhere in the frame. */
  .light-overlay {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
    background: radial-gradient(
      circle farthest-corner at var(--light-x) var(--light-y),
      rgba(255, 255, 255, var(--light-intensity)) 0%,
      rgba(255, 255, 255, calc(var(--light-intensity) * 0.45)) calc(var(--light-spread) * 0.35),
      rgba(255, 255, 255, calc(var(--light-intensity) * 0.12)) calc(var(--light-spread) * 0.7),
      rgba(255, 255, 255, 0) var(--light-spread)
    );
    mix-blend-mode: screen;
  }

  @media (prefers-reduced-motion: reduce) {
    .ring { animation: none; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="ring">
    <!-- No counter-rotation anywhere: a tile's visual tilt is just its
         live position angle (ring spin + fixed slot angle), like text
         printed radially on a real spinning disc. Upright at the 0deg
         (top) position, inverted at 180deg (bottom), by construction. -->
    <div class="tile" style="transform: rotate(0deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/o.png" alt="O" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(40deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/u.png" alt="U" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(80deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/r.png" alt="R" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(120deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/o.png" alt="O" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(160deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/b.png" alt="B" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(200deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/o.png" alt="O" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(240deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/r.png" alt="R" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(280deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/o.png" alt="O" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
    <div class="tile" style="transform: rotate(320deg) translateY(-36vmin);">
      <div class="tile-face">
        <img class="tile-img tile-letter" src="images/s.png" alt="S" />
        <img class="tile-img tile-strike" src="images/strike.png" alt="" />
      </div>
    </div>
  </div>

  <div class="center">
    <img class="mouse-icon" id="mouse-icon" src="images/mouse/idle.png" alt="" />
  </div>
</div>

<div class="light-overlay"></div>

<script src="mouse.js"></script>
</body>
</html>
